# Collection sources. Owner decision D2 (see docs/SRS.md):
#  - open sources and brochures are enabled by default;
#  - social-network and movie connectors stay off until `legal_approved: true`
#    is recorded here by someone authorised to approve it.
wikimedia:
  enabled: true
  thumb_width: 1600

openverse:
  # Open-licence catalogue (Wikimedia, Flickr CC, museums...) via its official API.
  # Most results originate from Flickr under Creative Commons licences; add
  # `exclude_providers: [flickr]` to keep only non-social-network origins.
  enabled: true
  page_size: 20              # anonymous maximum
  max_queries_per_model: 2   # anonymous quota is 200 searches/day
  max_pages: 1
  exclude_providers: []
  # Register a free app at https://api.openverse.org/v1/#tag/auth for higher limits:
  client_id_env: OPENVERSE_CLIENT_ID
  client_secret_env: OPENVERSE_CLIENT_SECRET

manifest:
  # Re-download a collection made elsewhere: CSV files from `carid export-manifest`.
  enabled: true
  paths: ["data/manifests/*.csv"]

brochure_sites:
  enabled: true
  # List pages you are allowed to collect from (manufacturer press/media sites,
  # brochure archives, review sites whose terms allow it). robots.txt is obeyed.
  # `model` and `year` are optional; when given they label every image on the page.
  sites: []
  #  - make: Toyota
  #    model: Corolla
  #    year: 2020
  #    urls: ["https://example.com/press/corolla-2020-interior"]
  #    license: "Manufacturer press image"

press_sites:
  # Manufacturer press rooms, searched per model through the site's own search page.
  # Press images are published for editorial use; the per-site licence is recorded on
  # each image. Only sites whose search works without JavaScript or a bot check are
  # listed (checked 2026-11-12); robots.txt is obeyed. Add more in the same form.
  enabled: true
  follow_links: 4      # result pages (press releases/kits) naming the model, per search
  sites:
    - make: Toyota
      search_url: "https://pressroom.toyota.com/?s={query}"
      query: "{model} interior"
      follow_links: 0          # results page already shows the photos
    - make: Skoda
      make_aliases: ["Škoda"]
      search_url: "https://www.skoda-storyboard.com/en/?s={query}"
      query: "{model} interior"
      follow_links: 0
    - make: Nissan
      search_url: "https://usa.nissannews.com/en-US/search?q={query}"
    - make: Honda
      search_url: "https://hondanews.com/en-US/search?q={query}"
    - make: Subaru
      # No working search page: start from the home page, which links every model.
      search_url: "https://media.subaru.com/"
      follow_links: 2
    - make: Seat
      search_url: "https://www.seat-mediacenter.com/search.html?q={query}"

folder:
  enabled: true
  # <path>/<Make>/<Model>/<Year or anything>/*.jpg|*.pdf
  path: imports

flickr:
  enabled: false
  legal_approved: false
  api_key_env: FLICKR_API_KEY
  licenses: "1,2,3,4,5,6,9,10"

brave_images:
  # Open-web image search through the Brave Search API (Google's Custom Search
  # API is closed to new customers and shuts down on 2027-01-01). Results come
  # from any website with unknown licences, and Brave's standard plans do not
  # grant storage rights for results: get legal approval before turning it on.
  # Key: create one at https://brave.com/search/api/ and set it on the server as
  # the environment variable below (never commit it). Billed per search request.
  enabled: false
  legal_approved: false
  api_key_env: BRAVE_API_KEY
  count: 50                  # results per search, max 200
  max_queries_per_model: 2   # searches per model per job (cost control)
  safesearch: strict
  # country: ALL
  # search_lang: en
  exclude_domains: []        # e.g. [pinterest.com] to skip re-posting sites

video_frames:
  enabled: false
  legal_approved: false
  path: imports/videos
  every_seconds: 2

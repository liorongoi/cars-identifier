[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carid"
version = "0.1.0"
description = "CarID-Interior: identify a vehicle's make, model and year from interior images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pillow>=10.2",
  "opencv-python-headless>=4.9,<5",
  "imagehash>=4.3",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deep models (recommended for production accuracy). Install the CPU or CUDA torch build first.
ml = ["torch>=2.2", "open_clip_torch>=2.24", "transformers>=4.40", "faiss-cpu>=1.8"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
carid = "carid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carid = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "N818", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/carid"]

[[tool.mypy.overrides]]
module = ["carid.api.*", "carid.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["carid"]
omit = ["src/carid/vision/deep.py"]

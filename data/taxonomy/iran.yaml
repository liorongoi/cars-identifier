# Makes and models present on the Iranian market (owner request, 2026-11-12).
# Load with:  carid init --seed-file data/taxonomy/iran.yaml   (adds to the database)
#
# Many cars built in Iran are foreign models under an Iranian badge with the same
# interior. Those are filed under the original make, with the Iranian badge as an
# alias, so photos under either name count for the same car:
#   Fownix -> Chery,  Xtrim -> Exeed,  KMC -> JAC,  Tissan -> Jetour,
#   IKCO Cheval 2 -> Haval Chitu,  Renault Tondar 90 -> Renault Logan.
# MVM keeps its own make because its model names differ from Chery's.
# Model lists were compiled from public sources and general knowledge; verify
# and extend them in the UI (Add make / Database).
makes:
  # ---- Iranian makes
  - name: Iran Khodro
    country: Iran
    aliases: [IKCO, Iran Khodro Company]
    models:
      - {name: Samand}
      - {name: Dena, aliases: [Dena Plus]}
      - {name: Runna, aliases: [Runna Plus]}
      - {name: Soren, aliases: [Soren Plus]}
      - {name: Tara}
      - {name: Rira}
      - {name: Arisun}
      - {name: Paykan}
  - name: SAIPA
    country: Iran
    models:
      - {name: Pride, aliases: [Saba, Nasim]}
      - {name: Tiba}
      - {name: Saina}
      - {name: Quick}
      - {name: Shahin}
      - {name: Atlas}
      - {name: Sahand}
  - name: Zamyad
    country: Iran
    models:
      - {name: Z24, aliases: [Zamyad Pickup, Z28]}
      - {name: Padra}
      - {name: Karun}
  - name: MVM
    country: Iran
    aliases: [Modiran Vehicle Manufacturing, Modiran Khodro]
    models:
      - {name: "110"}
      - {name: "315"}
      - {name: "530"}
      - {name: "550"}
      - {name: X22}
      - {name: X33}
      - {name: X55}
  - name: Bahman
    country: Iran
    aliases: [Bahman Motor, Bahman Group]
    models:
      - {name: Capra}
      - {name: Fidelity}
      - {name: Dignity}
      - {name: Respect}
